name: Publish Protea container

on:
  workflow_dispatch:

concurrency:
  group: publish-container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/leafliber/protea

jobs:
  build:
    if: github.repository == 'leafliber/Protea' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, and push by digest
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          build_args=(
            --platform "linux/$ARCH"
            --target full
            --build-arg "VERSION=$version"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker buildx build "${build_args[@]}" --provenance=false --load -t protea:smoke .
          scripts/container-smoke.sh protea:smoke
          docker buildx build "${build_args[@]}" \
            --provenance=mode=max \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/image.json" .
          digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/image.json")"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the multi-platform image
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Version $version already exists in GHCR." >&2
            exit 1
          fi
          images=()
          for file in "$RUNNER_TEMP"/digests/*; do
            images+=("$IMAGE@sha256:${file##*/}")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Self-hosted, event-driven personal AI assistant" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$version" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --tag "$IMAGE:$version" --tag "$IMAGE:latest" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$version" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          '
