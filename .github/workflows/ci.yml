# CI (docs/40-plan/01-roadmap.md M6): checks, tests and a dependency audit on every push and
# pull request; the image (full and slim) is built, smoke-tested in a container and scanned.
# Nothing is published: pushing to a registry is a separate, manual step.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # Blocks on high and critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [full, slim]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          tags: protea:ci-${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Size
        run: docker image inspect protea:ci-${{ matrix.target }} -f '{{.Size}}' | awk '{printf "uncompressed %.0f MB\n", $1/1048576}'
      - name: Smoke test (non-root, healthy, answers, survives stop/start, backup)
        run: scripts/container-smoke.sh protea:ci-${{ matrix.target }}
      - name: Scan (high and critical, fixable)
        # Pinned to the commit of v0.36.0 (2026-04-22): tags can be moved, a commit cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: protea:ci-${{ matrix.target }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
