name: 功能建议
description: 提出新能力、工作流程或文档改进
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 你在做什么，目前遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 请描述期望的行为或工作流程。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法或参考
      description: 如有临时方案、相关 Issue 或参考实现，可以一并附上。
